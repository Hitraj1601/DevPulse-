server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: devpulse-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 15s

  # Database DataSource Configuration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:devpulse_db}
    username: ${POSTGRES_USER:devpulse_app}
    password: ${POSTGRES_PASSWORD:devpulse_local_dev_secret_change_in_prod}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA & Hibernate Settings (Strictly Validate - Never Replace Flyway Migrations)
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway Migrations Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

# Custom DevPulse Application Properties
devpulse:
  dev-ingestion:
    enabled: ${DEVPULSE_DEV_INGESTION_ENABLED:false}
  cors:
    allowed-origins: ${DEVPULSE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
