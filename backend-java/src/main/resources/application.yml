server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: devpulse-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

# Custom DevPulse Application Properties
devpulse:
  dev-ingestion:
    enabled: ${DEVPULSE_DEV_INGESTION_ENABLED:false}
  cors:
    allowed-origins: ${DEVPULSE_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
